<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "{{ .Site.BaseURL }}#website",
      "url": "{{ .Site.BaseURL }}",
      "name": "{{ .Site.Params.brandName }}",
      "description": "{{ .Site.Params.siteDescription }}",
      "inLanguage": "zh-CN",
      "publisher": {
        "@type": "Organization",
        "@id": "{{ .Site.BaseURL }}#organization",
        "name": "{{ .Site.Params.brandName }}",
        "url": "{{ .Site.BaseURL }}",
        "logo": {
          "@type": "ImageObject",
          "url": "{{ .Site.BaseURL }}images/avatar.webp"
        }
      }
    },
    {
      "@type": "Organization",
      "@id": "{{ .Site.BaseURL }}#organization",
      "name": "{{ .Site.Params.brandName }}",
      "url": "{{ .Site.BaseURL }}",
      "logo": "{{ .Site.BaseURL }}images/avatar.webp",
      "description": "{{ .Site.Params.siteDescription }}"
    }
    {{ if not .IsHome }}
    ,
    {
      "@type": "BreadcrumbList",
      "@id": "{{ .Permalink }}#breadcrumb",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "首页",
          "item": "{{ .Site.BaseURL }}"
        }
        {{ if .IsSection }}
        ,
        {
          "@type": "ListItem",
          "position": 2,
          "name": {{ .Title | jsonify }},
          "item": "{{ .Permalink }}"
        }
        {{ else }}
        ,
        {
          "@type": "ListItem",
          "position": 2,
          "name": {{ with .CurrentSection }}{{ .Title | jsonify }}{{ else }}{{ .Title | jsonify }}{{ end }},
          "item": "{{ with .CurrentSection }}{{ .Permalink }}{{ else }}{{ .Permalink }}{{ end }}"
        }
        {{ if and .IsPage (ne .Permalink .CurrentSection.Permalink) }}
        ,
        {
          "@type": "ListItem",
          "position": 3,
          "name": {{ .Title | jsonify }},
          "item": "{{ .Permalink }}"
        }
        {{ end }}
        {{ end }}
      ]
    }
    {{ end }}
    {{ if or .IsPage .IsSection }}
    ,
    {
      "@type": "Article",
      "@id": "{{ .Permalink }}#article",
      "isPartOf": {
        "@id": "{{ .Site.BaseURL }}#website"
      },
      "headline": {{ .Title | jsonify }},
      "description": {{ with .Description }}{{ . | jsonify }}{{ else }}{{ .Site.Params.siteDescription | jsonify }}{{ end }},
      "mainEntityOfPage": "{{ .Permalink }}",
      "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
      "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
      "author": {
        "@type": "Organization",
        "name": "{{ .Params.author | default "机场life 网络安全与可观测性实验室" }}"
      },
      "publisher": {
        "@type": "Organization",
        "@id": "{{ .Site.BaseURL }}#organization",
        "name": "{{ .Site.Params.brandName }}",
        "url": "{{ .Site.BaseURL }}"
      }
    }
    {{ end }}
    {{ if eq .RelPermalink "/faq/" }}
    ,
    {
      "@type": "FAQPage",
      "@id": "{{ .Permalink }}#faq",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "为什么节点显示延迟很低，但网页打不开？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "因为测试延迟只是测试了你到代理服务器的 TCP 握手连接，网页打不开通常是本地 DNS 污染或系统代理未正确写入注册表，开启 TUN 虚拟网卡模式即可解决。"
          }
        },
        {
          "@type": "Question",
          "name": "为什么必须选择真正的 IPLC / IEPL 内网专线？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "因为公网跨境链路在晚高峰必然遭遇运营商 QoS 严重丢包；内网专线走电信物理内网光纤，晚高峰 0 丢包且恒定 20ms 低延迟。"
          }
        },
        {
          "@type": "Question",
          "name": "为什么廉价小作坊年付极易跑路？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "专线带宽是按月计费的刚性重资产，几十元的低价年付在数月内就会被专线月租吸干导致资金链断裂，务必认准光速云等运营超4年的稳健老牌。"
          }
        }
      ]
    }
    {{ end }}
  ]
}
</script>
