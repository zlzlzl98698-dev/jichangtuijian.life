<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} - {{ .Site.Params.brandName }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.siteDescription }}{{ end }}">
  <link rel="canonical" href="{{ .RelPermalink }}">
  <meta name="robots" content="index, follow">
  <link rel="icon" href="/images/avatar.webp" type="image/webp">
  <link rel="apple-touch-icon" href="/images/avatar.webp">

  <!-- Open Graph / Social -->
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.siteDescription }}{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:site_name" content="{{ .Site.Params.brandName }}">
  <meta property="og:image" content="{{ .Site.BaseURL }}images/avatar.webp">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ .Site.BaseURL }}images/avatar.webp">

  <!-- Theme Styles -->
  <link rel="stylesheet" href="/css/style.css?v={{ now.Unix }}">
  {{ partial "schema.html" . }}
</head>
<body>
  {{ partial "header.html" . }}

  <main class="main-wrapper">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}
  <script src="/js/main.js" defer></script>
</body>
</html>
