{{ define "main" }}

<div class="article-header" style="margin-bottom:2rem;">
  <div class="article-breadcrumb">
    <a href="/">首页</a> / <span>{{ .Title }}</span>
  </div>
  <h1 class="article-title">{{ .Title }}</h1>
  {{ with .Description }}
  <p class="hero-desc">{{ . }}</p>
  {{ end }}
</div>

<div class="prose" style="margin-bottom:2.5rem;background:var(--bg-card);padding:2rem;border-radius:12px;border:1px solid var(--border-color);">
  {{ .Content }}
</div>

<div class="section-title-wrap">
  <div class="section-title">
    <span>📂</span> 本栏目下属三级内容集群与专题指南
  </div>
</div>

<div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));gap:1.5rem;margin-bottom:3rem;">
  {{ range .Pages }}
  <div class="brand-card">
    <div>
      <div style="font-size:0.75rem;color:var(--accent-cyan);font-family:var(--font-mono);margin-bottom:0.3rem;">
        {{ .Date.Format "2006-01-02" }}
      </div>
      <h3 style="font-size:1.15rem;color:#fff;margin-bottom:0.6rem;">
        <a href="{{ .RelPermalink }}" style="color:inherit;text-decoration:none;">{{ .Title }}</a>
      </h3>
      <p style="font-size:0.88rem;color:var(--text-muted);line-height:1.6;">
        {{ .Description | default .Summary }}
      </p>
    </div>
    <div style="margin-top:1rem;padding-top:0.75rem;border-top:1px solid rgba(255,255,255,0.05);">
      <a href="{{ .RelPermalink }}" style="font-size:0.85rem;font-weight:600;">阅读全文与深度指南 ➔</a>
    </div>
  </div>
  {{ end }}
</div>

{{ end }}
